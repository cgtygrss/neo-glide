import groovy.json.JsonOutput

// Run from android/ with -I ../scripts/export-android-licenses.gradle
// :app:exportRuntimeLicenseInputs. Resolve the actual release dependency graph.
allprojects { project ->
    afterEvaluate {
        if (project.path == ':app') {
            tasks.register('exportRuntimeLicenseInputs') {
                doLast {
                    def artifacts = configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.findAll {
                        it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    }.collect { component ->
                        def id = component.id
                        def cached = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/${id.group}/${id.module}/${id.version}")
                        def files = []
                        if (cached.exists()) cached.eachFileRecurse { if (it.name.endsWith('.aar') || it.name.endsWith('.jar')) files.add(it) }
                        [group: id.group, name: id.module, version: id.version, file: files ? files.first().absolutePath : '']
                    }.sort { it.group + ':' + it.name }
                    def output = new File(project.rootDir, 'build/legal-runtime-artifacts.json')
                    output.parentFile.mkdirs()
                    output.text = JsonOutput.prettyPrint(JsonOutput.toJson(artifacts))
                    println "Exported ${artifacts.size()} runtime artifacts to ${output}"
                }
            }
        }
    }
}
