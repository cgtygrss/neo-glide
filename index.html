<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <meta name="theme-color" content="#0b1725" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>Neo Glide</title>
  <link rel="preload" href="/brand/neo-glide-mark.svg" as="image" type="image/svg+xml" />
  <style>
    /* Ensure fullscreen */
    html,
    body {
      background: #0b1725;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    #startup-poster { position: fixed; inset: 0; background: #0b1725; }
    #startup-poster img { position: absolute; left: 50%; top: 50%; width: 120px; height: 97px; transform: translate(-50%, -50%); opacity: .18; }
  </style>
</head>

<body>
  <div id="root"><div id="startup-poster" aria-hidden="true"><img src="/brand/neo-glide-mark.svg" alt="" width="120" height="97" /></div></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
