apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Google Play signs purchase data with the app's Play Console licensing public
// key. It is public material, but stays outside source control so each release
// build can supply the correct key without a placeholder being shipped.
def playBillingPublicKey = providers.gradleProperty("NEO_GLIDE_PLAY_BILLING_PUBLIC_KEY")
        .orElse(providers.environmentVariable("NEO_GLIDE_PLAY_BILLING_PUBLIC_KEY"))
        .getOrElse("")
if (!playBillingPublicKey) {
    def billingPropertiesFile = rootProject.file("billing.properties")
    if (billingPropertiesFile.exists()) {
        def billingProperties = new Properties()
        billingProperties.load(new FileInputStream(billingPropertiesFile))
        playBillingPublicKey = billingProperties.getProperty("NEO_GLIDE_PLAY_BILLING_PUBLIC_KEY", "")
    }
}
def escapedPlayBillingPublicKey = playBillingPublicKey.replace("\\", "\\\\").replace("\"", "\\\"")

def playGamesAppId = providers.gradleProperty("NEO_GLIDE_PLAY_GAMES_APP_ID")
        .orElse(providers.environmentVariable("NEO_GLIDE_PLAY_GAMES_APP_ID"))
        .map { it.trim() ?: "0" }.getOrElse("0")
if (!(playGamesAppId ==~ /[0-9]+/)) throw new GradleException("Invalid Play Games application ID.")

android {
    namespace "com.cgtygrss.neoglide"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "com.cgtygrss.neoglide"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode providers.gradleProperty("NEO_GLIDE_BUILD_NUMBER").map { it.toInteger() }.getOrElse(5)
        versionName new groovy.json.JsonSlurper().parse(rootProject.file("../package.json")).version
        buildConfigField "String", "PLAY_BILLING_PUBLIC_KEY", "\"${escapedPlayBillingPublicKey}\""
        resValue "string", "game_services_project_id", playGamesAppId
        manifestPlaceholders["neoGlideGamesEnabled"] = playGamesAppId != "0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        buildConfig true
    }
    
    if (System.getenv("NEO_GLIDE_CI_SIGNED_RELEASE") == "true" && !keystorePropertiesFile.exists()) {
        throw new GradleException("CI release requires an explicit upload signing configuration.")
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:9.1.0"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
