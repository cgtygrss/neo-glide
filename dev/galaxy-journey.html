<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neo Glide · Galaxy journeys</title><style>
*{box-sizing:border-box}body{margin:0;background:#08131f;color:#d7eae8;font:14px system-ui,sans-serif;padding:20px}header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}h1{font-size:20px;margin:0 auto 0 0}button,select{min-height:44px;padding:8px 12px;background:#17313f;color:#d7eae8;border:1px solid #3d616e;border-radius:8px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #abedda;outline-offset:3px}.flight{max-width:1060px;margin:auto}.flight canvas{display:block;width:100%;aspect-ratio:844/390}#distance{width:100%;min-height:44px;accent-color:#9bded0}label{display:block;margin-top:12px}output{font-variant-numeric:tabular-nums}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}article{overflow:hidden;background:#102331;border-radius:10px}article canvas{display:block;width:100%}p{padding:0 12px;color:#98b8c5;font-size:12px} @media(max-width:700px){body{padding:12px}main{grid-template-columns:repeat(2,minmax(0,1fr))}h1{width:100%}select{max-width:65%}}
</style></head><body><header><h1>One galaxy. Four regions.</h1><select id="stage" aria-label="Galaxy destination"></select><button id="play" aria-pressed="false">Play journey</button></header><section class="flight"><canvas id="flight" role="img" aria-label="Galaxy flight preview"></canvas><label for="distance">Flight distance · <output id="metres">0 m</output></label><input id="distance" type="range" min="0" max="1920" value="0" step="1"></section><main id="regions"></main><script type="module" src="./galaxy-journey.js"></script></body></html>
